<loading-bar-component />
@let initializer = isInitializer();
@let initializerPwd = isInitializerPwd();
@if (initializer && initializerPwd) {
  <router-outlet
    (document:keypress)="onActivity($event)"
    (document:mousemove)="onActivity($event)"
  />
} @else {
  <initializer-component [initializerPwd]="initializerPwd" [initializer]="initializer" />
}
