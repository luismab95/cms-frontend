@if (!loading()) {
  <div class="w-screen h-screen">
    <div class="w-full header sticky z-99">
      <grid
        [gridType]="'header'"
        [languageId]="languageId()"
        [preview]="true"
        [previewType]="previewType()"
      />
    </div>
    <div class="w-full body">
      <grid
        [gridType]="'body'"
        [languageId]="languageId()"
        [preview]="true"
        [previewType]="previewType()"
      />
    </div>
    <div class="w-full footer">
      <grid
        [gridType]="'footer'"
        [languageId]="languageId()"
        [preview]="true"
        [previewType]="previewType()"
      />
    </div>
  </div>
}
