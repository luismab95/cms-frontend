@if (initializate()) {
  <div class="w-screen h-auto">
    <grid
      class="sticky z-99"
      [gridType]="'header'"
      [pageElementsConfig]="{ css: '', config: {} }"
      [languageId]="languageId()"
      [preview]="true"
      [previewType]="previewType()"
    />

    <grid
      [gridType]="'page'"
      [pageElementsConfig]="{ css: '', config: {} }"
      [languageId]="languageId()"
      [preview]="true"
      [previewType]="previewType()"
    />
    <grid
      [gridType]="'footer'"
      [pageElementsConfig]="{ css: '', config: {} }"
      [languageId]="languageId()"
      [preview]="true"
      [previewType]="previewType()"
    />
  </div>
}
