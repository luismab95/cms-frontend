<div
  class="relative flex min-h-[calc(100vh-10rem)] w-screen flex-col items-center justify-center overflow-hidden px-4 py-16 selection:bg-indigo-100 selection:text-indigo-900 sm:px-6 lg:px-8"
>
  <!-- Ambient Soft Aura -->
  <div
    class="pointer-events-none absolute h-125 w-125 translate-y-[-10%] rounded-full bg-linear-to-tr from-indigo-100/60 via-slate-100/50 to-transparent blur-3xl"
  ></div>

  <div
    class="pointer-events-none absolute h-90 w-90 translate-x-32 translate-y-16 rounded-full bg-purple-100/40 blur-2xl"
  ></div>

  <!-- Central Canvas -->
  <div class="relative z-10 flex w-full max-w-2xl flex-col items-center text-center">
    <!-- Status Pill -->
    <div
      class="mb-8 inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/80 px-4 py-1.5 shadow-sm backdrop-blur-md"
    >
      <span class="h-2 w-2 animate-ping rounded-full bg-indigo-600"></span>

      <span class="text-xs font-semibold uppercase tracking-[0.2em] text-indigo-600">
        Error de Ruta • 404
      </span>
    </div>

    <!-- Sculptural 404 Visual Display -->
    <div class="relative my-1 flex w-full select-none items-center justify-center py-4">
      <!-- Botanical Floating Accents Left -->
      <div
        class="pointer-events-none absolute left-6 top-1/2 flex -translate-y-1/2 flex-col items-center gap-2 opacity-85 transition-transform duration-700 hover:scale-110 sm:left-14"
      >
        <svg
          class="h-12 w-8 -rotate-12 text-purple-500 drop-shadow-sm"
          fill="none"
          viewBox="0 0 32 48"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16 46C16 30 16 12 16 2"
            stroke="currentColor"
            stroke-dasharray="2 3"
            stroke-linecap="round"
            stroke-width="1.8"
          ></path>

          <circle
            cx="10"
            cy="18"
            fill="currentColor"
            fill-opacity="0.18"
            r="6.5"
            stroke="currentColor"
            stroke-width="1.5"
          ></circle>

          <path d="M10 11.5V24.5" stroke="currentColor" stroke-width="1.2"></path>

          <circle
            cx="21"
            cy="32"
            fill="currentColor"
            fill-opacity="0.22"
            r="7.5"
            stroke="currentColor"
            stroke-width="1.5"
          ></circle>

          <path d="M21 24.5V39.5" stroke="currentColor" stroke-width="1.2"></path>
        </svg>
      </div>

      <!-- Botanical Floating Accents Right -->
      <div
        class="pointer-events-none absolute right-6 top-1/2 flex -translate-y-1/2 rotate-0 flex-col items-center gap-2 opacity-85 transition-transform duration-700 hover:scale-110 sm:right-14"
      >
        <svg
          class="h-14 w-8 rotate-6 text-purple-500 drop-shadow-sm"
          fill="none"
          viewBox="0 0 32 54"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M16 52C16 35 16 16 16 2"
            stroke="currentColor"
            stroke-dasharray="2 3"
            stroke-linecap="round"
            stroke-width="1.8"
          ></path>

          <circle
            cx="22"
            cy="16"
            fill="currentColor"
            fill-opacity="0.22"
            r="7"
            stroke="currentColor"
            stroke-width="1.5"
          ></circle>

          <path d="M22 9V23" stroke="currentColor" stroke-width="1.2"></path>

          <circle
            cx="10"
            cy="34"
            fill="currentColor"
            fill-opacity="0.18"
            r="6"
            stroke="currentColor"
            stroke-width="1.5"
          ></circle>

          <path d="M10 28V40" stroke="currentColor" stroke-width="1.2"></path>
        </svg>
      </div>

      <!-- Huge 404 Typography -->
      <div
        class="flex items-center justify-center gap-1 text-[100px] font-extrabold leading-none tracking-tighter sm:gap-4 sm:text-[150px] md:text-[180px]"
      >
        <span
          class="text-slate-900 drop-shadow-[0_8px_16px_rgba(11,28,48,0.08)] transition-transform duration-300 hover:-translate-y-1"
        >
          4
        </span>

        <span
          class="relative scale-105 text-indigo-600 drop-shadow-[0_12px_24px_rgba(79,70,229,0.18)] transition-transform duration-300 hover:-translate-y-1"
        >
          0
        </span>

        <span
          class="text-slate-900 drop-shadow-[0_8px_16px_rgba(11,28,48,0.08)] transition-transform duration-300 hover:-translate-y-1"
        >
          4
        </span>
      </div>
    </div>

    <!-- Editorial Text Block -->
    <div class="mb-8 mt-4 flex max-w-lg flex-col items-center gap-2">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-[36px] sm:leading-10.5">
        Ups... 404!
      </h1>

      <p class="max-w-md text-base font-normal leading-relaxed text-slate-500 sm:text-lg">
        La página que buscas no existe o ha cambiado de lugar.
      </p>
    </div>

    <!-- Action Group -->
    <div class="flex w-full flex-col items-center justify-center gap-4 sm:w-auto sm:flex-row">
      <a
        class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-6 py-3 text-sm font-semibold text-white shadow-md transition-all hover:bg-indigo-700 hover:shadow-lg active:scale-95 sm:w-auto"
        [routerLink]="'/'"
      >
        <span>Volver al inicio</span>
        <i
          class="fa-solid fa-arrow-right text-sm transition-transform group-hover:translate-x-0.5"
        ></i>
      </a>
    </div>
  </div>
</div>
