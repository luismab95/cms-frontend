<div class="mx-auto max-w-full px-2 sm:px-6 lg:px-8 pt-4">
  <!-- Page Title Header -->
  <div
    class="mb-8 flex flex-col md:flex-row md:items-end md:justify-between gap-4 border-b border-slate-200/80 pb-6"
  >
    <div data-aos="fade-up" data-aos-duration="1000">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">Ajustes</h1>
      <p class="mt-1 text-sm text-slate-500 leading-relaxed max-w-2xl">
        Configura y administra la información de tu cuenta, incluyendo tus datos de perfil y cambio
        de contraseñas.
      </p>
    </div>
  </div>
  <!-- Main Layout Grid: Segmented Floating Rail & Main Form Content -->
  <div class="w-full flex-1">
    <drawer-component [panels]="panels()" (selectedPanelEvent)="goToPanel($event)">
      @if (validPermission(permission.vieProfile)) {
        @switch (selectedPanel()) {
          @case ('account') {
            <!-- <sitie-information /> -->
            <settings-account [edit]="validPermission(permission.editProfile)" [user]="user()!" />
          }
          @case ('security') {
            <settings-security [edit]="validPermission(permission.editProfile)" [user]="user()!" />
          }
        }
      } @else {
        <permission-component />
      }
    </drawer-component>
  </div>
</div>
