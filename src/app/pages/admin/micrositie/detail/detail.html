<div class="w-full h-full min-h-0 flex flex-col overflow-hidden">
  <section
    data-aos="fade-left"
    data-aos-duration="1000"
    class="w-full h-full min-h-0 flex flex-col overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm"
  >
    <div class="shrink-0 p-3 lg:p-6 pb-0 bg-white border-b border-slate-100">
      <!-- Page Title Header -->
      <div
        data-aos="fade-up"
        data-aos-duration="1000"
        class="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-1"
      >
        <div>
          <div class="flex items-center gap-3">
            <div class="flex items-center justify-center">
              <button
                (click)="goToBack()"
                aria-label="regresar"
                class="cursor-pointer w-10 h-10 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-300"
                type="button"
              >
                <i class="fa-solid fa-arrow-left"></i>
              </button>
            </div>
            <div>
              <h1
                class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-2.5"
              >
                {{ micrositie() ? 'Micrositio' : 'Nuevo micrositio' }}
              </h1>
              <p class="text-xs sm:text-sm text-slate-500 font-normal">
                Configura y administra la información de tus micrositios y sus páginas.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Layout Grid: Segmented Floating Rail & Main Form Content -->
    <div class="flex-1 min-h-0 flex flex-col overflow-hidden p-2 lg:p-6 mt-4 lg:mt-0">
      <drawer-component [panels]="panels()" (selectedPanelEvent)="goToPanel($event)">
        @if (validPermission(permission.viewMicrosite)) {
          @switch (selectedPanel()) {
            <!-- Information -->
            @case ('information') {
              <microsities-information />
            }
            <!-- pages -->
            @case ('pages') {
              <div class="h-160">
                <pages />
              </div>
            }
          }
        } @else {
          <permission-component />
        }
      </drawer-component>
    </div>
  </section>
</div>
