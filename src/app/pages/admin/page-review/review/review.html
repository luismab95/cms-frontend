@let preview = this.preview();
@let page = this.reviewPage()!;
@if (page !== null) {
  <div
    #canvas
    id="canvas"
    data-aos="fade-left"
    data-aos-duration="1000"
    class="w-full h-full min-h-0 flex-col overflow-hidden gap-4 lg:px-2 p-0 flex"
  >
    <section
      [class.hidden!]="!enabledCanvas()"
      class="shrink-0 rounded-2xl border border-slate-200/80 bg-white shadow-sm overflow-hidden"
    >
      <toolbar-review-pages-component
        [urlStatics]="urlStatics()"
        [name]="page.name"
        [saveAction]="saveAction()"
        [preview]="preview"
        (goBackEvent)="goToBack()"
        (togglePreviewModeEvent)="setPreviewMode($event)"
        (toggleCompareChangeEvent)="setReviewChanges($event)"
        (setLanguageIdEvent)="setLanguageId($event)"
        (cancelEvent)="cancel()"
        (confirmReviewPageEvent)="confirmReviewPage()"
      />
    </section>

    @if (validPermission(permission.viewReviewPages)) {
      <section
        [class.hidden!]="!enabledCanvas()"
        class="flex-1 min-h-0 rounded-2xl border border-slate-200/80 bg-white shadow-sm overflow-hidden"
      >
        <div class="flex flex-row h-full min-h-0 overflow-hidden transition-all">
          <div
            class="flex-1 min-w-0 min-h-0 h-full overflow-y-auto overflow-x-auto bg-slate-200/75 relative p-3 flex flex-col items-center justify-start bg-dot-grid"
          >
            <div
              [ngClass]="{
                'w-full': preview === 'none' || preview === 'desktop',
                'w-208.5': preview === 'tablet',
                'w-97.5': preview === 'mobile',
              }"
              class="px-1 page-preview shrink-0 rounded-xl overflow-hidden border border-slate-300/80 transition-all duration-300 relative flex flex-col bg-white"
            >
              <div class="p-6 relative">
                <grid-review-component
                  #grid
                  [pageElementsConfig]="pageElementsConfig()"
                  [comments]="comments()"
                  [gridType]="'page'"
                  [gridStyles]="bodyStyles()"
                  [languageId]="languageId()"
                  [previewType]="preview"
                  [isInReviewMode]="reviewChanges()"
                  (addCommentEvent)="addComment($event)"
                  (removeCommentEvent)="removeComment($event)"
                />
              </div>
            </div>
          </div>
          <review-detail-component #reviewForm [gridType]="'page'" />
        </div>
      </section>
    } @else {
      <permission-component />
    }

    <section
      [class.flex!]="!enabledCanvas()"
      class="w-full h-full min-h-0 hidden flex-col overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm"
    >
      <disabled-canvas-component (goBackEvent)="goToBack()" />
    </section>
  </div>
}
