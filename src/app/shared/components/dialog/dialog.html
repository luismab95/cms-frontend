@if (_dialogService.isOpen()) {
  <div
    aria-labelledby="modal-title"
    aria-modal="true"
    class="fixed inset-0 z-80 flex items-center justify-center p-4 bg-white-900/60 backdrop-blur-xs transition-all"
    role="dialog"
  >
    <div
      class="relative w-full max-w-md bg-white rounded-2xl border border-slate-200/80 shadow-2xl overflow-hidden p-6 text-left"
    >
      <!-- Close X button -->
      <button
        (click)="_dialogService.toggleDialog()"
        aria-label="Cerrar diálogo"
        class="cursor-pointer absolute top-4 right-4 w-8 h-8 rounded-lg flex items-center justify-center text-slate-300 hover:text-slate-600 hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-300"
        type="button"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- Header with warning icon and title -->
      <div class="flex items-start space-x-4">
        @if (_dialogService.dialogData()?.type === 'warning') {
          <div
            class="w-12 h-12 rounded-full bg-amber-50 border border-amber-200/80 flex items-center justify-center shrink-0 shadow-sm"
          >
            <i class="fa-solid fa-triangle-exclamation text-amber-500"></i>
          </div>
        }
        <div class="pr-6">
          <h3
            [innerHTML]="_dialogService.dialogData()?.title"
            class="text-lg font-bold text-slate-900 tracking-tight leading-snug"
            id="modal-title"
          ></h3>
          <p
            [innerHTML]="_dialogService.dialogData()?.message"
            class="text-xs text-slate-500 mt-1 leading-relaxed"
          ></p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="mt-6 flex flex-col sm:flex-row items-center justify-end gap-2.5 pt-2">
        <button
          (click)="onCancelAction()"
          class="cursor-pointer w-full sm:w-auto px-4 py-2.5 rounded-lg border border-slate-300 bg-white text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-slate-900 shadow-sm transition-all focus:outline-none focus:ring-1 focus:ring-slate-300"
          type="button"
        >
          {{ _dialogService.dialogData()?.cancelButton }}
        </button>
        <button
          (click)="onConfirmAction()"
          class="cursor-pointer w-full sm:w-auto inline-flex items-center justify-center px-4 py-2.5 rounded-lg text-xs font-semibold text-white bg-indigo-500 hover:bg-indigo-600 shadow-sm transition-all focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:ring-offset-2"
          type="button"
        >
          <span class="flex items-center justify-center gap-2">
            <i class="fa-solid fa-check"></i>
            {{ _dialogService.dialogData()?.confirmButton }}
          </span>
        </button>
      </div>
    </div>
  </div>
}
