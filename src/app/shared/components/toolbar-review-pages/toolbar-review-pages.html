@let preview = this.preview();
<div class="flex flex-row items-center justify-between h-16 overflow-hidden p-4">
  <div class="flex items-center gap-3">
    <button
      (click)="goToBack()"
      class="cursor-pointer flex items-center justify-center h-9 w-9 rounded-lg hover:bg-slate-100 text-slate-600 transition-colors"
      [title]="'Regresar'"
      type="button"
    >
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="h-4 w-px bg-slate-200 mx-1"></div>

    <div class="flex flex-col">
      <span
        class="font-semibold text-slate-800 text-[11px] leading-tight text-ellipsis line-clamp-1 max-w-40"
        >{{ name() }}
      </span>
      <span class="text-[10px] flex items-center gap-1 text-emerald-600">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Revisando ({{ preview }})
      </span>
    </div>
    <div class="h-4 w-px bg-slate-200"></div>

    <button
      class="cursor-pointer h-10 flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-slate-700 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors border border-slate-200"
      appTooltip="Comparar cambios con la versión actual"
      (click)="toggleChanges()"
    >
      <i
        [ngClass]="{ 'fa-code-compare': !currentContentPage(), 'fa-eye': currentContentPage() }"
        class="text-slate-500 fa-solid"
      ></i>
      <span>{{ currentContentPage() ? 'Ver cambios' : 'Comparar Diff' }}</span>
    </button>
  </div>

  <div class="flex items-center gap-2">
    <div
      class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 shadow-inner"
    >
      <button
        [ngClass]="{
          'font-semibold! bg-white! text-indigo-600! shadow-sm!': preview === 'mobile',
        }"
        class="cursor-pointer flex h-10 items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-all disabled:cursor-not-allowed"
        (click)="togglePreviewMode('mobile')"
        title="Móvil (390px)"
        type="button"
      >
        <i class="fa-solid fa-mobile-screen-button"></i>
        <span [class.font-semibold]="preview === 'mobile'" class="text-[11px] font-normal"
          >390px</span
        >
      </button>
      <button
        [ngClass]="{
          'font-semibold! bg-white! text-indigo-600! shadow-sm!': preview === 'tablet',
        }"
        class="cursor-pointer h-10 flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-all disabled:cursor-not-allowed"
        (click)="togglePreviewMode('tablet')"
        title="Tablet (834px)"
        type="button"
      >
        <i class="fa-solid fa-tablet-screen-button"></i>
        <span [class.font-semibold]="preview === 'tablet'" class="text-[11px] font-normal"
          >834px</span
        >
      </button>
      <button
        [ngClass]="{
          'font-semibold! bg-white! text-indigo-600! shadow-sm!': preview === 'desktop',
        }"
        class="cursor-pointer h-10 flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-all disabled:cursor-not-allowed"
        (click)="togglePreviewMode('desktop')"
        title="Desktop (1440px)"
        type="button"
      >
        <i class="fa-solid fa-desktop"></i>
        <span [class.font-semibold]="preview === 'desktop'" class="text-[11px] font-normal"
          >1440px</span
        >
      </button>
    </div>
  </div>

  <div class="h-4 w-px bg-slate-200 mx-1"></div>
  <div class="flex items-center gap-3">
    <ng-select
      #languageSelect
      [clearable]="false"
      [searchable]="false"
      [items]="activeLanguages()"
      [ngModel]="languageId()"
      (ngModelChange)="setLanguageId($event)"
      bindLabel="name"
      bindValue="id"
      class="language-select"
    >
      <ng-template ng-label-tmp let-item="item">
        <button
          type="button"
          (click)="openLanguageSelect($event)"
          class="group flex items-center gap-2 h-9 px-2.5 rounded-lg border border-slate-200 bg-white hover:border-slate-300 hover:bg-slate-50 transition-all duration-150 cursor-pointer disabled:cursor-not-allowed disabled:opacity-60"
        >
          <span
            class="flex items-center justify-center w-5 h-4 overflow-hidden rounded-sm bg-slate-100 ring-1 ring-slate-200"
          >
            <img
              class="w-full h-full object-cover"
              [alt]="item.name"
              [src]="urlStatics() + item.icon"
            />
          </span>
          <span class="text-xs font-semibold text-slate-700">
            {{ item.lang | uppercase }}
          </span>
          <i
            class="fa-solid fa-chevron-down text-[10px] text-slate-400 ml-0.5 transition-transform"
          ></i>
        </button>
      </ng-template>

      <ng-template ng-option-tmp let-item="item">
        <div
          class="flex items-center gap-3 rounded-lg mx-1 my-0.5 hover:bg-slate-50 transition-colors"
        >
          <span
            class="flex items-center justify-center w-6 h-4.5 overflow-hidden rounded-sm bg-slate-100 ring-1 ring-slate-200 shrink-0"
          >
            <img
              class="w-full h-full object-cover"
              [alt]="item.name"
              [src]="urlStatics() + item.icon"
            />
          </span>
          <div class="flex flex-col min-w-0 flex-1">
            <span class="text-xs font-semibold text-slate-700 truncate">
              {{ item.name }}
            </span>
            <span class="text-[10px] text-slate-400 uppercase">
              {{ item.lang }}
            </span>
          </div>
        </div>
      </ng-template>
    </ng-select>
  </div>

  <div
    [ngClass]="{
      'border-emerald-200': !currentContentPage(),
      'border-rose-200': currentContentPage(),
      'bg-emerald-50/70': !currentContentPage(),
      'bg-rose-50/70': currentContentPage(),
    }"
    class="items-center space-x-2 px-3 py-1 border text-xs rounded-full shadow-xs"
  >
    <span
      [ngClass]="{
        'text-emerald-700': !currentContentPage(),
        'text-rose-700': currentContentPage(),
        'cursor-pointer': !currentContentPage(),
      }"
      class="flex items-center text-[11px] gap-x-2 gap-y-1"
    >
      <span class="relative flex h-2 w-2">
        <span
          [ngClass]="{
            'animate-ping': !currentContentPage(),
            'bg-emerald-500': !currentContentPage(),
            'bg-rose-500': currentContentPage(),
          }"
          class="absolute inline-flex h-full w-full rounded-full opacity-75"
        ></span>

        <span
          [ngClass]="{
            'bg-emerald-500': !currentContentPage(),
            'bg-rose-500': currentContentPage(),
          }"
          class="relative inline-flex rounded-full h-2 w-2"
        ></span>
      </span>

      {{
        currentContentPage()
          ? 'Visualizando el contenido actual de la página'
          : 'Revisando los cambios de la página'
      }}
    </span>
  </div>

  <div class="h-4 w-px bg-slate-200 mx-1"></div>
  <div class="flex items-center gap-3">
    <button
      (click)="cancel()"
      class="cursor-pointer h-10 px-3 py-1.5 text-xs font-medium text-slate-600 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors disabled:cursor-not-allowed"
    >
      Descartar
    </button>
    <div class="inline-flex rounded-lg shadow-sm">
      <button
        [disabled]="saveAction()"
        (click)="confirmReviewPage()"
        class="cursor-pointer h-10 inline-flex items-center gap-x-2 gap-y-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3.5 py-1.5 rounded-lg transition-colors focus:ring-2 focus:ring-indigo-500/20 disabled:cursor-not-allowed disabled:bg-indigo-300"
        type="button"
      >
        <span class="flex items-center justify-center gap-2">
          @if (!saveAction()) {
            <i class="fa-regular fa-paper-plane fa-xs"></i>
          } @else {
            <i class="fa-solid fa-spinner fa-spin text-white"></i>
          }
          <span>Enviar revisión</span>
        </span>
      </button>
    </div>
  </div>
</div>
