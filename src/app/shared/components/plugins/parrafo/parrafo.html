<element-wrapper-component
  [preview]="preview()"
  [isInReviewMode]="isInReviewMode()"
  [element]="element()"
  [comments]="comments()"
  (selectElementEvent)="selectElement($event)"
>
  <p [id]="element().uuid" [class]="element().class">
    {{ element().text['parrafo'] }}
  </p>
</element-wrapper-component>
