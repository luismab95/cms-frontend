<element-wrapper-component
  [preview]="preview()"
  [isInReviewMode]="isInReviewMode()"
  [element]="element()"
  [comments]="comments()"
  (selectElementEvent)="selectElement($event)"
>
  <div
    style="display: flex; align-items: center; justify-content: center; width: 100%; height: auto"
  >
    <article [id]="element().uuid" [class]="element().class" type="button">
      <div class="w-full flex flex-col gap-4">
        <imagen-plugin
          [element]="imageElement()!"
          [preview]="preview()"
          [isInReviewMode]="isInReviewMode()"
          [comments]="comments()"
          (selectElementEvent)="selectElement($event)"
        />

        <etiqueta-plugin
          [element]="titleElement()!"
          [preview]="preview()"
          [isInReviewMode]="isInReviewMode()"
          [comments]="comments()"
          (selectElementEvent)="selectElement($event)"
        />
        <parrafo-plugin
          [element]="descriptionElement()!"
          [preview]="preview()"
          [isInReviewMode]="isInReviewMode()"
          [comments]="comments()"
          (selectElementEvent)="selectElement($event)"
        />
      </div>

      <boton-plugin
        [element]="buttonElement()!"
        [preview]="preview()"
        [isInReviewMode]="isInReviewMode()"
        [comments]="comments()"
        (selectElementEvent)="selectElement($event)"
      />
    </article>
  </div>
</element-wrapper-component>
