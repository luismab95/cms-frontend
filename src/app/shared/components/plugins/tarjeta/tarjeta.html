<element-wrapper-component
  [preview]="preview()"
  [isInReviewMode]="isInReviewMode()"
  [element]="element()"
  [comments]="comments()"
  (selectElementEvent)="selectElement($event)"
>
  <div [id]="element().uuid" [class]="element().class">
    <div class="relative h-auto">
      <imagen-plugin
        [element]="imageElement()!"
        [preview]="preview()"
        [isInReviewMode]="isInReviewMode()"
        [comments]="comments()"
        (selectElementEvent)="selectElement($event)"
      />
      <etiqueta-plugin
        [element]="badgeElement()!"
        [preview]="preview()"
        [isInReviewMode]="isInReviewMode()"
        [comments]="comments()"
        (selectElementEvent)="selectElement($event)"
      />
    </div>

    <div class="p-5">
      <etiqueta-plugin
        [element]="titleElement()!"
        [preview]="preview()"
        [isInReviewMode]="isInReviewMode()"
        [comments]="comments()"
        (selectElementEvent)="selectElement($event)"
      />
      <parrafo-plugin
        [element]="descriptionElement()!"
        [preview]="preview()"
        [isInReviewMode]="isInReviewMode()"
        [comments]="comments()"
        (selectElementEvent)="selectElement($event)"
      />
      <boton-plugin
        [element]="buttonElement()!"
        [preview]="preview()"
        [isInReviewMode]="isInReviewMode()"
        [comments]="comments()"
        (selectElementEvent)="selectElement($event)"
      />
    </div>
  </div>
</element-wrapper-component>
