<element-wrapper-component
  [preview]="preview()"
  [isInReviewMode]="isInReviewMode()"
  [element]="element()"
  [comments]="comments()"
  (selectElementEvent)="selectElement($event)"
>
  <div
    class="flex h-full w-full items-center justify-center box-border"
    [id]="element().uuid"
    [class]="element().class"
    (focusout)="onFocusOut($event)"
    (keydown)="onKeyDown($event)"
  >
    <div class="relative inline-flex items-center justify-center">
      <button
        type="button"
        class="cursor-pointer inline-flex gap-2 min-h-10.5 min-w-13.5 items-center justify-center gap-1,75 rounded-lg border border-gray-200 bg-white px-2.25 py-1.25 text-gray-700 transition-[background-color,border-color,box-shadow,transform] duration-200 hover:border-gray-300 hover:bg-gray-50 hover:shadow-[0_2px_8px_rgba(0,0,0,0.08)] active:scale-[0.97] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 disabled:cursor-default disabled:opacity-60"
        [class.rotate-180]="false"
        [disabled]="!languages().length"
        [attr.aria-expanded]="isOpen()"
        aria-label="Seleccionar idioma"
        aria-haspopup="listbox"
        [title]="currentLanguage()?.name || 'No hay idiomas disponibles'"
        (click)="toggleDropdown($event)"
      >
        @if (currentLanguage(); as language) {
          @if (language.icon) {
            <img
              class="block size-6.75 rounded-full object-cover"
              [src]="language.icon"
              [alt]="language.name"
            />
          }

          <span class="text-[13px] font-semibold uppercase leading-none">
            {{ language.lang }}
          </span>
        }

        <span
          class="flex items-center justify-center transition-transform duration-200"
          [class.rotate-180]="isOpen()"
          aria-hidden="true"
        >
          <svg class="size-3.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M6 9L12 15L18 9"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>

      <div
        class="absolute left-1/2 top-[calc(100%+8px)] z-999999 flex max-h-70 w-45 -translate-x-1/2 flex-col overflow-auto rounded-[10px] border border-gray-200 bg-white p-1.25 shadow-[0_10px_25px_rgba(0,0,0,0.1),0_2px_6px_rgba(0,0,0,0.05)]"
        [hidden]="!isOpen()"
        role="listbox"
        aria-label="Idiomas"
      >
        @for (language of languages(); track language.lang) {
          <button
            type="button"
            class="cursor-pointer flex w-full items-center rounded-[7px] border-0 bg-transparent p-2 text-left transition-colors hover:bg-gray-100 focus-visible:bg-gray-100 focus-visible:outline-none"
            [class.bg-indigo-50]="currentLanguage()?.lang === language.lang"
            role="option"
            [attr.aria-selected]="currentLanguage()?.lang === language.lang"
            (click)="selectLanguage(language)"
          >
            @if (language.icon) {
              <img
                class="size-7.5 shrink-0 rounded-full object-cover"
                [src]="language.icon"
                alt=""
                loading="lazy"
              />
            }

            <span class="ml-2.5 flex min-w-0 flex-col">
              <span class="whitespace-nowrap text-[13px] font-semibold text-gray-900">
                {{ language.name }}
              </span>

              <span class="mt-0.5 text-[11px] uppercase text-gray-400">
                {{ language.lang }}
              </span>
            </span>

            <span
              class="ml-auto hidden text-indigo-500"
              [class.!flex]="currentLanguage()?.lang === language.lang"
              aria-hidden="true"
            >
              ✓
            </span>
          </button>
        } @empty {
          <div class="p-3 text-center text-xs text-gray-400">No hay idiomas disponibles</div>
        }
      </div>
    </div>
  </div>
</element-wrapper-component>
