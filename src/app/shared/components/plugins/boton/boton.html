<element-wrapper-component
  [preview]="preview()"
  [isInReviewMode]="isInReviewMode()"
  [element]="element()"
  [comments]="comments()"
  (selectElementEvent)="selectElement($event)"
>
  <button (click)="actionEvent()" [id]="element().uuid" [class]="element().class" type="button">
    <imagen-plugin
      [element]="imageElement()!"
      [preview]="preview()"
      [isInReviewMode]="isInReviewMode()"
      [comments]="comments()"
      (selectElementEvent)="selectElement($event)"
    />
    <etiqueta-plugin
      [element]="labelElement()!"
      [preview]="preview()"
      [isInReviewMode]="isInReviewMode()"
      [comments]="comments()"
      (selectElementEvent)="selectElement($event)"
    />
  </button>
</element-wrapper-component>
