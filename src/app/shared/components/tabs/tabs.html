<!-- Language tabs -->
<div aria-label="Idiomas" class="rounded-t-xl bg-white px-2 pt-2 shadow-sm">
  <div class="flex items-center gap-1 overflow-x-auto no-scrollbar sm:gap-2">
    @for (tab of tabs(); track tab.id; let i = $index) {
      <button
        type="button"
        (click)="onSelectTab(i)"
        [attr.aria-selected]="selectedTab() === tab.id"
        class="cursor-pointer"
        [class]="
          selectedTab() === i
            ? 'group flex items-center gap-2 whitespace-nowrap rounded-t-lg border-b-2 border-indigo-600 bg-indigo-50/50 px-3.5 py-3 text-sm font-semibold text-indigo-600 transition-colors'
            : 'group flex items-center gap-2 whitespace-nowrap rounded-t-lg border-b-2 border-transparent px-3.5 py-3 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50 hover:text-indigo-600'
        "
      >
        @if (tab.type === 'image') {
          <img class="w-4 object-fill" [src]="tab.icon" [alt]="tab.description" />
        } @else {
          <i [class]="tab.icon"></i>
        }
        <span>
          {{ tab.title }}
        </span>
      </button>
    }
  </div>
</div>

<div #contentScroll class="p-4 space-y-6 min-h-90 h-auto overflow-y-auto overflow-x-hidden">
  <ng-content />
</div>
