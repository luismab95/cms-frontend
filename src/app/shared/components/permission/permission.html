@if (show()) {
  <section class="mx-auto flex w-full flex-col items-center justify-center px-6 py-12">
    <div
      class="flex w-full flex-col items-center max-w-5xl rounded-2xl bg-white p-8 text-center sm:p-10 overflow-hidden"
    >
      <div
        class="relative mb-6 flex h-16 w-16 items-center justify-center rounded-2xl border border-slate-200 bg-slate-50 shadow-inner"
      >
        <i class="fa-solid fa-shield-halved text-[32px] text-indigo-600"></i>
        <span
          class="absolute -right-1 -top-1 h-3 w-3 rounded-full bg-red-500 ring-2 ring-white"
        ></span>
      </div>
      <div
        class="mb-4 inline-flex items-center gap-2 rounded-full text-slate-700 bg-slate-50 border border-slate-200 px-3 py-1 text-sm font-medium"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>
        <span>Error 403</span>
        <span class="text-slate-300">•</span>
        <span class="text-slate-500">Acceso Restringido</span>
      </div>
      <h1 class="mb-2 max-w-lg text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">
        No tienes permisos para acceder a este recurso.
      </h1>
      <p class="mb-6 max-w-md text-sm leading-relaxed text-slate-500 sm:text-base">
        Tu cuenta actual no cuenta con las cslateenciales necesarias realizar acciones en este
        recurso.
      </p>
      <div
        class="mb-8 flex flex-wrap items-center justify-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm"
      >
        <span class="text-slate-500">
          Tu rol actual:
          <strong class="font-semibold text-indigo-600"> {{ role()?.name }} </strong>
        </span>
      </div>
      <div
        class="mb-4 flex w-full flex-col items-center justify-center gap-3 sm:w-auto sm:flex-row"
      >
        <button
          [routerLink]="'/admin/panel'"
          class="cursor-pointer flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 sm:w-auto"
          onclick="document.getElementById('solicitudModal').classList.toggle('hidden')"
          type="button"
        >
          <i class="fa-solid fa-arrow-left text-[18px]"></i> <span>Volver al panel principal</span>
        </button>
      </div>
      <div class="flex items-center gap-1.5 text-sm text-slate-400">
        <span>Si, ¿Crees que es un error?</span>
        <a class="font-medium text-indigo-600 transition-colors"> Contacta a soporte técnico </a>
      </div>
    </div>
  </section>
}
