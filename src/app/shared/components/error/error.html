<div class="fixed inset-0 w-full h-full overflow-hidden bg-white z-60">
  <div class="absolute inset-0 bg-slate-900/10 backdrop-blur-[6px] z-10"></div>
  <div
    class="bg-white w-full h-full relative z-50 flex flex-col items-center justify-center px-4 py-8 overflow-hidden"
  >
    <header
      class="absolute top-0 left-0 z-50 w-full px-8 py-6 flex items-center justify-between bg-white"
    >
      <div class="flex items-center gap-3">
        <div class="w-42 h-auto flex items-center justify-center">
          <img
            [src]="getLogo()"
            class="w-64 max-w-full object-contain"
            [alt]="getParameter('COMPANY_NAME')"
          />
        </div>
      </div>
    </header>

    <ng-content />

    <footer
      class="absolute bottom-0 left-0 right-0 z-60 w-full px-8 py-5 flex items-center justify-between text-xs text-slate-500"
    >
      <div class="flex items-center gap-2">
        <span>
          © {{ currentYear }}
          {{ getCompanyInfo('COMPANY_NAME')?.value }}
          Todos los derechos reservados.
        </span>
      </div>
    </footer>
  </div>
</div>
