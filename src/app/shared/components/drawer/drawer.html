<div class="grid grid-cols-1 gap-8 lg:grid-cols-12 items-start w-full">
  <div
    data-aos="fade-down"
    data-aos-duration="1000"
    class="lg:col-span-4 xl:col-span-4 space-y-4 hidden lg:block"
  >
    <div class="text-xs font-bold uppercase tracking-wider text-slate-400 px-1">
      Secciones de Configuración
    </div>
    <nav aria-label="Navegación de parámetros" class="space-y-2.5">
      @for (item of panels(); track i; let i = $index) {
        <button
          type="button"
          (click)="onSelectPanel(item.id, i)"
          class="group cursor-pointer relative flex w-full items-start justify-between gap-3 rounded-xl border-l-[5px] p-4 text-left transition duration-200"
          [class]="
            selectedPanel() === i
              ? 'border-l-indigo-600 bg-white shadow-lg ring-1 ring-indigo-600/30'
              : 'border-l-transparent bg-white/70 shadow hover:border-l-slate-300 hover:bg-white hover:shadow-md'
          "
        >
          <div class="flex items-start gap-3.5">
            <!-- Icono -->
            <div
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg transition"
              [class]="
                selectedPanel() === i
                  ? 'bg-indigo-50 text-indigo-600'
                  : 'bg-slate-100 text-slate-500 group-hover:text-slate-800'
              "
            >
              <i [class]="item.icon + ' h-5 w-5'"></i>
            </div>

            <!-- Información -->
            <div>
              <div class="flex items-center gap-2">
                <span
                  class="text-sm"
                  [class]="
                    selectedPanel() === i
                      ? 'font-bold text-slate-900'
                      : 'font-semibold text-slate-700 group-hover:text-slate-900'
                  "
                >
                  {{ item.title }}
                </span>
              </div>

              <p class="mt-1 text-xs text-slate-400">
                {{ item.description }}
              </p>
            </div>
          </div>

          <!-- Flecha únicamente para el activo -->
          @if (selectedPanel() === i) {
            <svg
              class="mt-0.5 h-5 w-5 shrink-0 text-indigo-600"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M8.25 4.5l7.5 7.5-7.5 7.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
          }
        </button>
      }
    </nav>
  </div>

  <!-- items for mobile-->
  <div
    #itemsContainer
    class="lg:hidden flex items-center gap-1 overflow-x-auto sm:gap-2"
  >
    @for (item of panels(); track i; let i = $index) {
      <button
        type="button"
        (click)="onSelectPanel(item.id, i)"
        class="group flex shrink-0 cursor-pointer items-center gap-2 whitespace-nowrap rounded-t-lg border-b-2 px-3.5 py-3 text-sm transition-colors"
        [class.border-indigo-600]="selectedPanel() === i"
        [class.bg-indigo-50/50]="selectedPanel() === i"
        [class.font-semibold]="selectedPanel() === i"
        [class.text-indigo-600]="selectedPanel() === i"
        [class.border-transparent]="selectedPanel() !== i"
        [class.font-medium]="selectedPanel() !== i"
        [class.text-slate-600]="selectedPanel() !== i"
        [class.hover:bg-slate-50]="selectedPanel() !== i"
        [class.hover:text-indigo-600]="selectedPanel() !== i"
      >
        <i [class]="item.icon"></i>
        <span>
          {{ item.title }}
        </span>
      </button>
    }
  </div>

  <div
    #contentScroll
    [class.max-h-90]="height() <= 639"
    [class.max-h-170]="height() > 639"
    data-aos="fade-left"
    data-aos-duration="1000"
    class="lg:col-span-8 xl:col-span-8 space-y-6 h-auto overflow-y-auto overflow-x-hidden px-4 lg:px-0"
  >
    <ng-content></ng-content>
    <div class="h-32 block lg:hidden"></div>
  </div>
</div>
